baseURL = 'https://fedang.net'
languageCode = 'en-us'
title = '~fedang'
theme = 'chilldark'
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
copyright = "Federico Angelilli © 2025"

[taxonomies]
	category = 'categories'
	tag = 'tags'
	series = 'series'

[outputs]
	home = ['html', 'rss']
	section = ['html']
	taxonomy = ['html']
	term = ['html']

[frontmatter]
  date = ['date', 'publishdate', 'pubdate', 'published', 'lastmod', ':git']
  lastmod = [':git', 'lastmod', 'date', 'publishdate' ]
  publishDate = ['publishdate', 'published', 'date']

[params.author]
	name = "Federico Angelilli"
	email = "main@fedang.net"

[params]
	title_crumbs = false
	custom_css = ["css/syntax.css"]

[security]
  enableInlineShortcodes = true

[markup]
  [markup.highlight]
	noClasses = false
  [markup.goldmark.renderer]
	unsafe = true
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        title = true
